[project]
name = "agentic-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "heycharm", email = "ichchinmay.in@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langsmith>=0.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic-langgraph = "agentic_langgraph:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
