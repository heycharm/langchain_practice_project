[project]
name = "ragpractice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "heycharm", email = "ichchinmay.in@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langsmith>=0.14.14",
    "openai>=3.24.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "typesense>=2.1.1",
]

[project.scripts]
ragpractice = "ragpractice:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
