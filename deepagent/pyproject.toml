[project]
name = "deepagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "heycharm", email = "ichchinmay.in@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.32",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
deepagent = "deepagent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
