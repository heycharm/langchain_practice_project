[project]
name = "langchain_project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "charm", email = "ichchinmay.in@gmail.com" }
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "ipykernel>=6.29.5",
    "langchain>=0.0.27",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain = "langchain:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "agentic_langgraph",
    "mcplangchaindemo",
    "ragpractice",
    "deepagent",
]
